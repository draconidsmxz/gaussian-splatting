[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian_splatting"
version = "0.1.9"
description = "<<<ENTER_DESCRIPTION>>>"
authors = [
    { name = "Tobias Kirschstein", email = "tobias.kirschstein@gmail.com" },
]
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.8.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
# urls = { Documentation = "<<<ENTER_LINK_TO_DOCUMENTATION>>>" }
# Main dependencies
dependencies = [
    "torch",
    "plyfile==0.8.1",
    "tqdm",
    "diff_gaussian_rasterization@git+https://github.com/tobias-kirschstein/diff-gaussian-rasterization-distwar.git@381a279b6422557185b9d480a6c8966708cf6081",
    "depth_diff_gaussian_rasterization@git+https://github.com/tobias-kirschstein/depth-diff-gaussian-rasterization.git@f9c4ed29373a0b8a499c5f468ee75afa42dd59a8",
    "diff_gaussian_rasterization_radegs@git+https://github.com/tobias-kirschstein/diff-gaussian-rasterization-radegs.git@8a41a4c1db28bce503b98484a0a8a98808dc1a5b",
    "simple_knn@git+https://gitlab.inria.fr/bkerbl/simple-knn.git@86710c2d4b46680c02301765dd79e465819c8f19",
    "gsplat",
    "dreifus",
    "elias",
    "viser~=0.2"
]

[project.optional-dependencies]
# Development packages, install via <<<PROJECT_NAME>>>[dev]
dev = [
]

[project.scripts]
# E.g., ns-download-data = "scripts.downloads.download_data:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gaussian_splatting*"]  # Keep the '*', otherwise submodules are not found
